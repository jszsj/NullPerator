name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Web deps (pnpm install)
        run: |
          cd web
          pnpm install --frozen-lockfile

      - name: Install SDK platform/build-tools/NDK/CMake
        run: |
          set -e
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKM="$(command -v sdkmanager || true)"
          [ -z "$SDKM" ] && SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108" "cmake;3.22.1" "platform-tools"
          echo "--- installed ---"
          "$SDKM" --list_installed | sed -n '1,50p'

      - name: Build debug APK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Show APK info
        run: |
          ls -l android/app/build/outputs/apk/debug/ || true
          find android/app/build/outputs -name '*.apk' -exec ls -l {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NullPerator-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
