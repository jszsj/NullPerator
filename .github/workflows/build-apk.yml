name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11'

      - name: Web deps (pnpm install)
        run: |
          cd web
          pnpm install --frozen-lockfile

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform/build-tools/NDK/CMake
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.0.13004108" "cmake;3.22.1" "platform-tools"
          echo "--- installed ---"
          sdkmanager --list_installed | sed -n '1,40p'

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Show APK info
        run: |
          ls -l android/app/build/outputs/apk/debug/ || true
          find android/app/build/outputs -name '*.apk' -exec ls -l {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NullPerator-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
